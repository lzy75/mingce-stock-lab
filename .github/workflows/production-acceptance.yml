name: Production acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify actual public origin and real cases
        run: node scripts/verify-production.mjs
      - name: Verify public AI/data endpoints and failure boundaries
        run: node scripts/check-web.mjs
        env:
          MINGCE_TEST_URL: https://mingce-stock-lab.justslug1.chatgpt.site
          MINGCE_TEST_REPORT: artifacts/production-http.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-acceptance
          path: artifacts/*.json
          retention-days: 30
